<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1b36" />
    <title>PlutoSolve — Marketing, Technology & Creative Solutions</title>
    <meta name="description" content="PlutoSolve helps businesses grow with marketing, websites, technology, branding and business tools." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PlutoSolve" />
    <meta property="og:title" content="PlutoSolve — Marketing, Technology & Creative Solutions" />
    <meta property="og:description" content="PlutoSolve helps businesses grow with marketing, websites, technology, branding and business tools." />
    <meta property="og:url" content="https://plutosolve.com/" />
    <meta property="og:image" content="https://plutosolve.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://plutosolve.com/og.png" />
    <script>
      /* Loading screen: shown before first paint, lifted by SiteLoader (7s failsafe so it can never stick). */
      (function () {
        try {
          var d = document.documentElement
          d.classList.add('is-loading')
          setTimeout(function () {
            if (d.classList.contains('is-loading')) {
              d.classList.remove('is-loading')
              window.dispatchEvent(new Event('site-ready'))
            }
          }, 7000)
        } catch (e) {}
      })()
    </script>
    <style>
      /* Critical CSS for the loading screen (inline so it paints before the app bundle). */
      #site-loader { position: fixed; inset: 0; z-index: 100000; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 1.6rem; background: #fff; opacity: 1; transition: opacity 0.5s ease; touch-action: none; overscroll-behavior: contain; }
      html.is-loading #site-loader, html.is-navigating #site-loader, #site-loader.is-leaving { display: flex; }
      html.is-navigating:not(.is-loading) #site-loader:not(.is-leaving) { animation: loader-in 0.22s ease both; }
      #site-loader.is-leaving { opacity: 0; pointer-events: none; }
      html.is-loading, html.is-loading body { overflow: hidden; overscroll-behavior: none; touch-action: none; }
      .loader-mark { height: clamp(4.5rem, 16vh, 6.5rem); width: auto; animation: loader-rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .loader-word { animation: loader-rise 0.9s 0.18s cubic-bezier(0.22, 1, 0.36, 1) both; margin-top: -0.6rem; font: 700 1.6rem/1 Inter, system-ui, sans-serif; letter-spacing: -0.03em; color: #1e1b36; }
      .loader-word b { font-weight: 700; color: #6a5c9a; }
      .loader-stitch { animation: loader-rise 0.9s 0.34s ease both; width: 12rem; height: 1px; color: #6a5c9a; background-image: repeating-linear-gradient(90deg, currentColor 0 7px, transparent 7px 12px); opacity: 0.55; }
      .loader-bar { width: min(14rem, 55vw); height: 2px; overflow: hidden; background: #e8e6ef; }
      .loader-bar > span { display: block; height: 100%; background: #6a5c9a; transform-origin: left; transform: scaleX(var(--p, 0.08)); transition: transform 0.12s linear; }
      #site-loader:not([data-progress]) .loader-bar > span { animation: loader-creep 5s ease-out forwards; }
      #site-loader[data-mode='nav'] .loader-bar > span { width: 40%; transform: none; animation: loader-sweep 1.1s ease-in-out infinite; }
      @keyframes loader-rise { from { opacity: 0; filter: blur(10px); } to { opacity: 1; filter: blur(0); } }
      @keyframes loader-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes loader-creep { from { transform: scaleX(0.08); } to { transform: scaleX(0.7); } }
      @keyframes loader-sweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #site-loader { transition: none; } .loader-mark, .loader-word, .loader-stitch { animation: none; } .loader-bar > span { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="site-loader" role="status" aria-live="polite" aria-label="Loading PlutoSolve">
      <img class="loader-mark" src="/loader-logo.png" alt="" width="160" height="133" />
      <div class="loader-word">pluto<b>solve</b></div>
      <div class="loader-stitch" aria-hidden="true"></div>
      <div class="loader-bar" aria-hidden="true"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
